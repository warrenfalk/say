[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'say-local'
version = '0.1.0'
description = 'Queued, streaming speech on your local machine'
requires-python = '>=3.11'
dependencies = ['pocket-tts==3.1.0']

[project.scripts]
say = 'say_cli.client:main'
say-service = 'say_cli.service:main'

[tool.setuptools.packages.find]
include = ['say_cli*']

[tool.ruff]
line-length = 100
